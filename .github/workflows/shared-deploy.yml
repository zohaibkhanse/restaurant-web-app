name: Shared Deploy

on:
  workflow_call:
    inputs:
      inventory:
        required: true
        type: string

      environment:
        required: true
        type: string

    secrets:
      SSH_PRIVATE_KEY:
        required: true
    

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: restaurant-web-app-build
          path: dist

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' \
          > ~/.ssh/ec2_rsa_key

          chmod 600 ~/.ssh/ec2_rsa_key

      - name: Verify SSH
        run: |
          ssh \
          -i ~/.ssh/ec2_rsa_key \
          -o StrictHostKeyChecking=no \
          ubuntu@3.144.164.7 \
          "echo SSH connection successful"

      - name: Deploy with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i ansible/inventory/${{ inputs.inventory }} \
            ansible/playbooks/deploy.yml \
            -e "artifact_path=${GITHUB_WORKSPACE}/dist" \
            -e "release_id=$(date +%Y%m%d%H%M%S)"