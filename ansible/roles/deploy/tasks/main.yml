---
- name: Check that build artifact exists
  ansible.builtin.stat:
    path: "{{ artifact_path }}"
  delegate_to: localhost
  become: false
  register: artifact

- name: Fail if build artifact does not exist
  ansible.builtin.fail:
    msg: "Build artifact not found: {{ artifact_path }}"
  when: not artifact.stat.exists

- name: Create release directory
  ansible.builtin.file:
    path: "{{ deploy_path }}/releases/{{ release_id }}"
    state: directory
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: "0755"

- name: Copy build artifact to server
  ansible.builtin.copy:
    src: "{{ artifact_path }}/"
    dest: "{{ deploy_path }}/releases/{{ release_id }}/"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    mode: "0644"

- name: Set release permissions
  ansible.builtin.file:
    path: "{{ deploy_path }}/releases/{{ release_id }}"
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    recurse: true

- name: Get current release
  ansible.builtin.command:
    cmd: readlink -f "{{ deploy_path }}/current"
  register: previous_release
  changed_when: false
  failed_when: false

- name: Store previous release ID
  ansible.builtin.set_fact:
    previous_release_id: "{{ previous_release.stdout | basename }}"
  when:
    - previous_release.rc == 0
    - previous_release.stdout | length > 0

- name: Switch current symlink to new release
  ansible.builtin.file:
    src: "{{ deploy_path }}/releases/{{ release_id }}"
    dest: "{{ deploy_path }}/current"
    state: link
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    force: true
  notify: Reload Nginx

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for application
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 80
    timeout: 30

- name: Check application health
  ansible.builtin.uri:
    url: "http://127.0.0.1/"
    status_code: 200
    return_content: false
  register: health_check
  retries: 5
  delay: 3
  until: health_check.status == 200
  ignore_errors: true

- name: Roll back to previous release
  ansible.builtin.file:
    src: "{{ deploy_path }}/releases/{{ previous_release_id }}"
    dest: "{{ deploy_path }}/current"
    state: link
    owner: "{{ansible_user}}"
    group: "{{ansible_user}}"
    force: true
  when:
    - health_check is failed
    - previous_release_id is defined
  notify: Reload Nginx

- name: Fail deployment after rollback
  ansible.builtin.fail:
    msg: "Deployment failed health check. Rolled back to {{ previous_release_id | default('no previous release available') }}."
  when: health_check is failed